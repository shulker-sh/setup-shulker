name: Setup Shulker
description: Install the shulker modpack CLI, add it to PATH, and cache the files it downloads.
author: shulker-sh

branding:
  icon: package
  color: orange

inputs:
  version:
    description: Release to install, such as v0.0.1, or latest.
    default: latest
  lock-files:
    description: The shulker.lock files the cache is keyed on, one path per line, relative to the workspace.
    default: shulker.lock
  prune:
    description: Prune files the listed locks no longer need from a cache restored from older locks.
    default: "true"

outputs:
  shulker-version:
    description: The shulker release that was installed, such as v0.0.1.
    value: ${{ steps.resolve.outputs.version }}
  shulker-path:
    description: The full path to the installed shulker binary.
    value: ${{ steps.path.outputs.shulker-path }}
  cache-hit:
    description: Whether the cache was restored from an exact match for the lock files.
    value: ${{ steps.cache.outputs.cache-hit }}
  minecraft-version:
    description: The lock's Minecraft version, such as 26.3. Set when one lock file is listed.
    value: ${{ steps.lock.outputs.minecraft-version }}
  loader:
    description: The lock's mod loader, such as fabric. Set when one lock file is listed and the pack has a loader.
    value: ${{ steps.lock.outputs.loader }}
  loader-version:
    description: The lock's mod loader version, such as 0.19.5. Set when one lock file is listed and the pack has a loader.
    value: ${{ steps.lock.outputs.loader-version }}

runs:
  using: composite
  steps:
    - name: Resolve shulker version
      id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        version="$INPUT_VERSION"
        case "$version" in
          "" | latest) version="$(gh release view --repo shulker-sh/shulker --json tagName --jq .tagName)" ;;
          v*) ;;
          *) version="v$version" ;;
        esac
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Hash lock files
      id: locks
      shell: bash
      env:
        LOCK_FILES: ${{ inputs.lock-files }}
      run: |
        sha() { if command -v sha256sum >/dev/null; then sha256sum; else shasum -a 256; fi | cut -d' ' -f1; }
        found=()
        while IFS= read -r path; do
          path="${path#"${path%%[![:space:]]*}"}"
          path="${path%"${path##*[![:space:]]}"}"
          [ -n "$path" ] || continue
          if [ -f "$path" ]; then
            found+=("$path")
          else
            echo "::warning::lock file $path not found; the cache key leaves it out"
          fi
        done <<< "$LOCK_FILES"
        hash=""
        if [ "${#found[@]}" -gt 0 ]; then
          hash="$(for path in "${found[@]}"; do echo "$path $(sha < "$path")"; done | sha)"
        fi
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
        echo "count=${#found[@]}" >> "$GITHUB_OUTPUT"
        {
          echo "paths<<SHULKER_LOCKS"
          printf '%s\n' "${found[@]}"
          echo "SHULKER_LOCKS"
        } >> "$GITHUB_OUTPUT"
        if [ "${#found[@]}" -eq 1 ]; then
          echo "project=$(dirname "${found[0]}")" >> "$GITHUB_OUTPUT"
        fi

    - name: Install shulker
      if: runner.os != 'Windows'
      shell: bash
      env:
        SHULKER_VERSION: ${{ steps.resolve.outputs.version }}
        SHULKER_INSTALL_DIR: ${{ runner.temp }}/setup-shulker
        GH_TOKEN: ${{ github.token }}
      run: curl -fsSL https://shulker.sh/install.sh | sh -s -- --no-modify-path --require-attestation

    - name: Install shulker
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SHULKER_VERSION: ${{ steps.resolve.outputs.version }}
        SHULKER_INSTALL_DIR: ${{ runner.temp }}/setup-shulker
        SHULKER_NO_MODIFY_PATH: "1"
        SHULKER_REQUIRE_ATTESTATION: "1"
        GH_TOKEN: ${{ github.token }}
      run: irm https://shulker.sh/install.ps1 | iex

    - name: Add shulker to PATH
      id: path
      shell: bash
      env:
        INSTALL_DIR: ${{ runner.temp }}/setup-shulker
        CACHE_DIR: ${{ runner.temp }}/shulker-cache
        EXE: ${{ runner.os == 'Windows' && 'shulker.exe' || 'shulker' }}
      run: |
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        echo "shulker-path=$INSTALL_DIR/$EXE" >> "$GITHUB_OUTPUT"
        echo "SHULKER_CACHE=$CACHE_DIR" >> "$GITHUB_ENV"

    - name: Read the lock
      id: lock
      if: steps.locks.outputs.count == '1'
      shell: bash
      env:
        PROJECT: ${{ steps.locks.outputs.project }}
      run: |
        cd "$PROJECT"
        echo "minecraft-version=$(shulker get --locked minecraft)" >> "$GITHUB_OUTPUT"
        echo "loader=$(shulker get --locked loader.type 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
        echo "loader-version=$(shulker get --locked loader.version 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

    - name: Restore shulker cache
      id: cache
      if: steps.locks.outputs.count != '0'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/shulker-cache
        key: shulker-${{ runner.os }}-${{ steps.locks.outputs.hash }}
        restore-keys: shulker-${{ runner.os }}-

    - name: Prune shulker cache
      if: inputs.prune == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        LOCKS: ${{ steps.locks.outputs.paths }}
      run: |
        if [ -z "$(ls -A "$SHULKER_CACHE" 2>/dev/null)" ]; then
          exit 0
        fi
        args=()
        while IFS= read -r path; do
          [ -n "$path" ] && args+=(--lock "$path")
        done <<< "$LOCKS"
        if [ "${#args[@]}" -eq 0 ]; then
          echo "::notice::skipping cache prune: no lock file was found, so it would keep nothing"
          exit 0
        fi
        shulker cache prune "${args[@]}" || echo "::warning::cache prune failed; the cache keeps files the locks no longer need"
